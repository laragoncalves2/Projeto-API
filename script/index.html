<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Princesas Disney</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>✨ Princesas Disney ✨</h1>
    <p>Digite o nome de uma princesa:</p>

    <input type="text" id="nome" placeholder="Ex: Ariel">
    <button onclick="buscar()">Pesquisar</button>

    <div id="resultado"></div>

    <script>
        const princesas = {
            "branca de neve": {
                nome: "Branca de Neve",
                filme: "Branca de Neve e os Sete Anões",
                ano: 1937
            },

            "cinderela": {
                nome: "Cinderela",
                filme: "Cinderela",
                ano: 1950
            },

            "aurora": {
                nome: "Aurora",
                filme: "A Bela Adormecida",
                ano: 1959
            },

            "ariel": {
                nome: "Ariel",
                filme: "A Pequena Sereia",
                ano: 1989
            },

            "bela": {
                nome: "Bela",
                filme: "A Bela e a Fera",
                ano: 1991
            },

            "jasmine": {
                nome: "Jasmine",
                filme: "Aladdin",
                ano: 1992
            },

            "pocahontas": {
                nome: "Pocahontas",
                filme: "Pocahontas",
                ano: 1995
            },

            "mulan": {
                nome: "Mulan",
                filme: "Mulan",
                ano: 1998
            },

            "tiana": {
                nome: "Tiana",
                filme: "A Princesa e o Sapo",
                ano: 2009
            },

            "rapunzel": {
                nome: "Rapunzel",
                filme: "Enrolados",
                ano: 2010
            },

            "merida": {
                nome: "Merida",
                filme: "Valente",
                ano: 2012
            },

            "moana": {
                nome: "Moana",
                filme: "Moana",
                ano: 2016
            },

            "raya": {
                nome: "Raya",
                filme: "Raya e o Último Dragão",
                ano: 2021
            }
        };

        function buscar() {
            let nome = document.getElementById("nome").value.toLowerCase().trim();
            let resultado = document.getElementById("resultado");

            if (princesas[nome]) {
                let princesa = princesas[nome];

                resultado.innerHTML = `
                    <h2>${princesa.nome}</h2>
                    <p><strong>Filme:</strong> ${princesa.filme}</p>
                    <p><strong>Ano:</strong> ${princesa.ano}</p>
                `;
            } else {
                resultado.innerHTML = "<p>Princesa não encontrada.</p>";
            }
        }
    </script>

</body>
</html>
