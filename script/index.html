<!DOCTYPE html> <html lang="pt-br"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Princesas Disney</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet"> <link rel="stylesheet" href="style.css"> </head> <body> <header> <h1>✨ Princesas Disney ✨</h1> <p>Pesquise o nome de uma das princesas oficiais da Disney</p> </header> <div class="card"> <input type="text" id="inputNomePrincesa" list="listaPrincesas" placeholder="Digite o nome... ex: Ariel, Elsa, Moana"> <datalist id="listaPrincesas"></datalist> <button onclick="buscarPrincesa()" id="btnPesquisar">Pesquisar</button> </div> <p id="aviso"></p> <div id="resultado" style="display:none;"></div> <p class="dica">Princesas disponíveis: Branca de Neve, Cinderela, Aurora, Ariel, Bela, Jasmine, Pocahontas, Mulan, Tiana, Rapunzel, Merida, Moana e Raya.</p> <script> const API_BASE = "https://api.disneyapi.dev/character"; const princesas = [ { nomeApi: "Snow White", nomePt: "Branca de Neve", filme: "Branca de Neve e os Sete Anões", ano: 1937, reino: "Floresta Encantada", descricao: "A primeira princesa Disney, conhecida por sua bondade e pela amizade com os sete anões." }, { nomeApi: "Cinderella", nomePt: "Cinderela", filme: "Cinderela", ano: 1950, reino: "Reino de conto de fadas", descricao: "Símbolo de esperança e gentileza, vive com a madrasta e as irmãs postiças até conhecer o príncipe." }, { nomeApi: "Aurora", nomePt: "Aurora", filme: "A Bela Adormecida", ano: 1959, reino: "Reino de Aurora", descricao: "Também conhecida como Bela Adormecida, foi amaldiçoada ao nascer e desperta com um beijo de amor verdadeiro." }, { nomeApi: "Ariel", nomePt: "Ariel", filme: "A Pequena Sereia", ano: 1989, reino: "Atlântica (reino submarino)", descricao: "Sereia curiosa e sonhadora que deseja viver no mundo humano." }, { nomeApi: "Belle", nomePt: "Bela", filme: "A Bela e a Fera", ano: 1991, reino: "Vila francesa", descricao: "Adora livros e enxerga a beleza interior, apaixonando-se pela Fera." }, { nomeApi: "Jasmine", nomePt: "Jasmine", filme: "Aladdin", ano: 1992, reino: "Agrabah", descricao: "Princesa destemida que luta por sua liberdade e independência." }, { nomeApi: "Pocahontas", nomePt: "Pocahontas", filme: "Pocahontas", ano: 1995, reino: "Povo Powhatan (Virgínia)", descricao: "Conectada à natureza, defende a paz entre seu povo e os colonizadores." }, { nomeApi: "Mulan", nomePt: "Mulan", filme: "Mulan", ano: 1998, reino: "China Imperial", descricao: "Guerreira corajosa que se disfarça de homem para salvar seu pai e a China." }, { nomeApi: "Tiana", nomePt: "Tiana", filme: "A Princesa e o Sapo", ano: 2009, reino: "Nova Orleans", descricao: "Trabalhadora e determinada, sonha em abrir seu próprio restaurante." }, { nomeApi: "Rapunzel", nomePt: "Rapunzel", filme: "Enrolados", ano: 2010, reino: "Corona", descricao: "Possui cabelos mágicos e enfrenta o mundo fora da torre pela primeira vez." }, { nomeApi: "Merida", nomePt: "Merida", filme: "Valente", ano: 2012, reino: "DunBroch (Escócia)", descricao: "Arqueira habilidosa que enfrenta as tradições para escolher seu próprio destino." }, { nomeApi: "Moana", nomePt: "Moana", filme: "Moana - Um Mar de Aventuras", ano: 2016, reino: "Motunui (ilha polinésia)", descricao: "Navegadora corajosa que parte em uma jornada para salvar sua ilha." }, { nomeApi: "Raya", nomePt: "Raya", filme: "Raya e o Último Dragão", ano: 2021, reino: "Kumandra", descricao: "Guerreira que busca reunir um reino fragmentado e restaurar a confiança entre os povos." } ]; const datalist = document.getElementById("listaPrincesas"); princesas.forEach(p => { const option = document.createElement("option"); option.value = p.nomePt; datalist.appendChild(option); }); function normalizar(texto) { return texto.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } async function buscarPrincesa() { const nomeDigitado = normalizar(document.getElementById("inputNomePrincesa").value); const aviso = document.getElementById("aviso"); const resultado = document.getElementById("resultado"); if (!nomeDigitado) { aviso.textContent = "Digite o nome de uma princesa"; resultado.style.display = "none"; return; } const princesa = princesas.find(p => normalizar(p.nomePt).includes(nomeDigitado)); if (!princesa) { aviso.textContent = "Essa princesa não está na lista"; resultado.style.display = "none"; return; } aviso.textContent = "Buscando imagem..."; resultado.style.display = "none"; let imagemUrl = ""; try { const resposta = await fetch(API_BASE + "?name=" + encodeURIComponent(princesa.nomeApi)); if (resposta.ok) { const dados = await resposta.json(); if (dados.data && dados.data.length > 0) { imagemUrl = dados.data[0].imageUrl || ""; } } } catch (erro) { // Se a busca da imagem falhar, mostramos um placeholder no lugar } aviso.textContent = ""; mostrarPrincesa(princesa, imagemUrl); } function mostrarPrincesa(princesa, imagemUrl) { const resultado = document.getElementById("resultado"); resultado.style.display = "flex"; const conteudoImagem = imagemUrl ? `<img src="${imagemUrl}" alt="${princesa.nomePt}">` : `<div class="avatar-placeholder">${princesa.nomePt.charAt(0)}</div>`; resultado.innerHTML = ` <div class="avatar">${conteudoImagem}</div> <h2>${princesa.nomePt}</h2> <p><strong>Filme:</strong> ${princesa.filme} (${princesa.ano})</p> <p><strong>Reino:</strong> ${princesa.reino}</p> <p>${princesa.descricao}</p> `; } document.getElementById("inputNomePrincesa").addEventListener("keydown", function (e) { if (e.key === "Enter") buscarPrincesa(); }); </script> </body> </html>
